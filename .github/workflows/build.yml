name: build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 + 单测 + 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: yarn test

      - name: Frontend build
        run: yarn build
