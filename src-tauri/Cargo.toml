[package]
name = "gloss-mod-manager"
version = "2.3.1"
description = "Gloss Mod Manager is a comprehensive modern game mod manager"
authors = ["小莫"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gloss_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset",'tray-icon'] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "local-time", "time"] }
tracing-appender = "0.2"
tracing-log = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
# MCP 服务鉴权令牌需要密码学安全的随机源。
uuid = { version = "1", features = ["v4"] }
# 本地下载器：替代 aria2 sidecar，单源多线程 + 断点续传 + 进度回调
simple_downloader = { path = "E:/Code/sdownload/simple_downloader", default-features = false, features = ["resume", "progress"] }
# P0 后端化：目录遍历 / MD5 流式哈希 / 批量文件搬运 / Junction 回退
walkdir = "2"
md5 = "0.7"
fs_extra = "1"
junction = "1"
# P1 配置原子写：跨进程文件锁（防并发丢条目）+ tmp 写再 rename（防半截文件）
fs2 = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-positioner = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
